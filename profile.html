        })();
    </script>
    <script>
        // My plan: status, dates, plays left, points, entries and one clear next step (rules in motorquiz.js)
        (function () {
            var root = document.getElementById('acctSub');
            function when(ms) { return QP_I18N.date(new Date(ms), { time: true, noYear: true }); }
            function stat(v, label) { return '<div><b>' + v + '</b><span>' + label + '</span></div>'; }
            function paint() {
                var s = MQ.sub(), st = MQ.stats(), html;
                if (!s) {
                    html = '<div class="mq-acct-head"><div><span class="mq-acct-label">My plan</span><b>No active plan</b></div></div>' +
                        '<p class="mq-acct-note">Subscribe to play and collect Lucky Draw entries.</p>' +
                        '<a href="subscribe.html" class="btn btn-lg button-primary w-100">' + (MQ.trialAvailable() ? 'Start Free Trial' : 'Subscribe') + '</a>';
                } else {
                    var p = s.plan, name = p.trial ? 'Free 1-Day Trial' : p.name;
                    var pill = p.trial ? '<span class="mq-pill on">Trial</span>' : s.cancelled ? '<span class="mq-pill off">Unsubscribed</span>' : '<span class="mq-pill on">Active</span>';
                    var date = p.trial || s.cancelled ? 'Ends ' + when(s.periodEnd) : MQ.money(p.price) + '/' + p.per + ' · renews ' + when(s.periodEnd);
                    var actions = p.trial ? '<a href="subscribe.html?change=1" class="btn btn-lg button-primary w-100">Subscribe Now</a>'
                        : s.cancelled ? '<a href="subscribe.html" class="btn btn-lg button-primary w-100">Subscribe Again</a>'
                        : '<a href="subscribe.html?change=1" class="btn mq-btn-outline w-100">Change Plan</a>' +
                          '<button type="button" class="mq-acct-link" data-bs-toggle="modal" data-bs-target="#modalUnsub">Unsubscribe</button>';
                    html = '<div class="mq-acct-head"><div><span class="mq-acct-label">My plan</span><b>' + name + '</b></div>' + pill + '</div>' +
                        '<div class="mq-acct-date">' + date + '</div>' +
                        '<div class="mq-acct-plays"><span>Plays left</span><b>' + s.left + '/' + p.questions + '</b></div>' +
                        actions;
                }
                root.innerHTML = html;
            }
            document.getElementById('btnUnsubConfirm').addEventListener('click', function () {
                MQ.cancel(); paint();
                var t = document.createElement('div'); t.className = 'saved-toast info'; t.textContent = 'You have unsubscribed';
                document.body.appendChild(t); setTimeout(function () { t.classList.add('hide'); }, 1800); setTimeout(function () { t.remove(); }, 2300);
            });
            paint();
        })();
    </script>
