    <script>
        // Subscription: active plan, plays left and entries; Subscribe / Change plan / Unsubscribe (rules in motorquiz.js)
        (function () {
            var C = MQ.CONFIG, badge = document.getElementById('subBadge'), text = document.getElementById('subText'), btn = document.getElementById('btnUnsub');
            function when(ms) { return QP_I18N.date(new Date(ms), { time: true, noYear: true }); }
            function paint() {
                var s = MQ.sub(), st = MQ.stats(), off = !s || s.cancelled;
                badge.textContent = !s ? 'Not Subscribed' : s.plan.trial ? 'Free Trial' : s.cancelled ? 'Unsubscribed' : 'Subscriber';
                badge.className = 'badge profile-sub-badge ' + (off ? 'button-grey' : 'background-success');
                text.innerHTML = !s
                    ? 'Subscribe to play MotorQuiz and collect Lucky Draw entries'
                    : '<b>' + (s.plan.trial ? 'Free 1-Day Trial' : s.plan.name + ' · ' + MQ.money(s.plan.price) + '/' + s.plan.per) + '</b> · ' + (s.plan.trial || s.cancelled ? 'ends ' : 'renews ') + when(s.periodEnd) +
                      '<br>' + s.left + '/' + s.plan.questions + ' plays left · ' + st.points.toLocaleString('en-US') + ' points · ' + st.entries + ' Lucky Draw entr' + (st.entries === 1 ? 'y' : 'ies') +
                      (s.plan.trial && !C.trial.confirmed ? ' <span class="mq-tbc">trial allowance TBC</span>' : '') +
                      (s.cancelled ? '' : '<br><a href="subscribe.html?change=1" style="color:#FE9E44;font-weight:bold">' + (s.plan.trial ? 'Subscribe Now' : 'Change Plan') + '</a>');
                btn.textContent = off || s.plan.trial ? 'Subscribe' : 'Unsubscribe';
                btn.classList.toggle('is-subscribe', off || s.plan.trial);
                if (off || s.plan.trial) btn.removeAttribute('data-bs-toggle'); else btn.setAttribute('data-bs-toggle', 'modal');
            }
            btn.addEventListener('click', function () {
                var s = MQ.sub();
                if (s && s.cancelled) { MQ.resume(); paint(); }
                else if (!s || s.plan.trial) location.href = s ? 'subscribe.html?change=1' : 'subscribe.html';
            });
            document.getElementById('btnUnsubConfirm').addEventListener('click', function () { MQ.cancel(); paint(); });
            paint();
        })();
    </script>
