    <script>
        // Account: active plan, management, remaining plays and entries
        (function () {
            var C = MQ.CONFIG, root = document.getElementById('acctSub');
            function when(ms) { return QP_I18N.date(new Date(ms), { time: true }); }
            function paint() {
                var s = MQ.sub(), st = MQ.stats(), html;
                if (!s) {
                    var trial = MQ.trialAvailable();
                    html = '<div class="mq-sub"><span class="mq-sub-ico off"><span class="fa fa-lock"></span></span>' +
                        '<div class="mq-sub-text"><b>No active plan</b><small>Subscribe to play and collect Lucky Draw entries</small></div><span class="mq-pill off">Inactive</span></div>' +
                        '<a href="subscribe.html" class="btn btn-lg ' + (trial ? 'button-gold' : 'button-primary') + ' w-100 mt-3">' + (trial ? 'Start Free Trial' : 'Subscribe Now') + '</a>';
                } else {
                    var p = s.plan;
                    html = '<div class="mq-card-head"><h3 class="mq-card-title">My Subscription</h3>' +
                            (p.trial ? '<span class="mq-pill trial">Free Trial</span>' : s.cancelled ? '<span class="mq-pill ending">Unsubscribed</span>' : '<span class="mq-pill on">Active</span>') + '</div>' +
                        '<div class="mq-sub"><span class="mq-sub-ico' + (p.trial ? ' trial' : '') + '"><span class="fa ' + (p.trial ? 'fa-gift' : 'fa-check-circle') + '"></span></span>' +
                            '<div class="mq-sub-text"><b>' + (p.trial ? 'Free 1-Day Trial' : p.name + ' · ' + MQ.money(p.price) + '/' + p.per) + '</b><small>' +
                            (p.trial || s.cancelled ? 'Ends ' : 'Renews ') + when(s.periodEnd) + '</small></div></div>' +
                        '<div class="mq-stats">' +
                            '<div class="mq-stat"><span class="mq-stat-ico q"><span class="fa fa-question"></span></span><b>' + s.left + '<small style="display:inline;font-size:.75rem">/' + p.questions + '</small></b><small>Plays left</small></div>' +
                            '<div class="mq-stat"><span class="mq-stat-ico p"><span class="fa fa-star"></span></span><b>' + st.points.toLocaleString('en-US') + '</b><small>Total points</small></div>' +
                            '<div class="mq-stat"><span class="mq-stat-ico e"><span class="fa fa-ticket"></span></span><b>' + st.entries + '</b><small>Entries this week</small></div>' +
                        '</div>' +
                        (p.trial && !C.trial.confirmed ? '<div class="text-center mt-2"><span class="mq-tbc">trial allowance TBC</span></div>' : '') +
                        '<div class="d-flex justify-content-between small mt-3"><span>Plan entries · Bonus entries</span><b>' + st.planEntries + ' · ' + st.bonusEntries + '</b></div>' +
                        '<div class="d-flex justify-content-between small mt-1"><span>Next bonus entry</span><b>' + st.progress + '/' + C.bonus.everyCorrect + ' correct</b></div>' +
                        '<div class="d-flex gap-2 mt-3">' +
                            (p.trial ? '<a href="subscribe.html?change=1" class="btn button-primary flex-fill">Subscribe Now</a>'
                             : s.cancelled ? '<button type="button" class="btn button-primary flex-fill" id="btnResume">Resubscribe</button>'
                             : '<a href="subscribe.html?change=1" class="btn button-primary flex-fill">Change Plan</a><button type="button" class="btn button-grey flex-fill" data-bs-toggle="modal" data-bs-target="#modalUnsub">Unsubscribe</button>') +
                        '</div>';
                }
                root.innerHTML = html;
                var r = document.getElementById('btnResume');
                if (r) r.addEventListener('click', function () { MQ.resume(); paint(); });
            }
            document.getElementById('btnUnsubConfirm').addEventListener('click', function () { MQ.cancel(); paint(); });
            paint();
        })();
    </script>
