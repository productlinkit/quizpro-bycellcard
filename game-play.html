<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizy Flash</title>
    <link rel="stylesheet" href="theme/css/bootstrap.min.css">
    <link rel="stylesheet" href="theme/fontello/css/quizy-flash.css">
    <link rel="stylesheet" href="theme/css/style.css">
    <link rel="stylesheet" href="theme/css/app.css">
    <link rel="stylesheet" href="theme/css/pages.css">
    <link rel="stylesheet" href="theme/css/game.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="shortcut icon" type="image/x-icon" href="https://demo.quizpro.mobi//theme/images/favicon-quizpro.ico">
</head>
<body>
    <div class="content-wrapper">

        <!-- Header: player, round timer, progress -->
        <div class="page-header-score game-header">
            <div class="container box-wrapper">
                <div class="play-hud">
                    <div class="game-player me">
                        <div class="game-ava" id="gp-me">
                            <img src="https://demo.quizpro.mobi//uploads/user/2/91819a12c87646f315a23b80fbf283ea.jpg" alt="You">
                        </div>
                        <div class="game-info">
                            <div class="game-name">You</div>
                            <div class="game-score" id="gp-score">0</div>
                        </div>
                        <span class="game-gain" id="gp-gain"></span>
                    </div>
                    <div class="play-timer" id="gp-timer" aria-label="Time left">
                        <svg viewBox="0 0 44 44" aria-hidden="true"><circle class="track" cx="22" cy="22" r="19"/><circle class="bar" id="gp-timer-bar" cx="22" cy="22" r="19"/></svg>
                        <span id="gp-time">30</span>
                    </div>
                    <div class="play-cat">
                        <span class="play-cat-ico"><img id="gp-cat-img" src="" alt=""></span>
                    </div>
                </div>
                <div class="play-progress" id="gp-dots" aria-hidden="true"></div>
                <div class="play-count"><span id="gp-num">1</span> of <span id="gp-total">5</span></div>
            </div>
        </div>

        <div class="container box-wrapper play-body">
            <div class="answer-toast" id="answerToast" aria-live="polite"></div>
            <div class="play-question" id="gp-question"></div>
            <ul class="play-options" id="gp-options"></ul>
            <button type="button" class="play-exit" id="gp-exit"><span class="fa fa-sign-out"></span> Exit quiz</button>
        </div>
    </div>

    <!-- Exit confirmation -->
    <div class="modal fade modal-standard" tabindex="-1" id="modalExit">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content confirm-modal">
                <span class="confirm-ico"><span class="fa fa-sign-out"></span></span>
                <h3 class="modal-level-title mb-2">Exit quiz?</h3>
                <p class="confirm-text">Your progress in this round will be lost.</p>
                <button type="button" class="btn btn-lg button-primary w-100 mb-2" data-bs-dismiss="modal">Keep Playing</button>
                <button type="button" class="btn btn-lg confirm-danger w-100" id="gp-exit-yes">Yes, Exit</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>
    <script src="theme/js/demo-backend.js"></script>
    <script src="theme/js/i18n.js"></script>
    <script src="theme/js/bootstrap.bundle.min.js"></script>
    <script src="theme/js/questions.js"></script>
    <script src="theme/js/play.js"></script>
</body>
</html>
