<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizy Flash</title>
    <link rel="stylesheet" href="theme/css/bootstrap.min.css">
    <link rel="stylesheet" href="theme/fontello/css/quizy-flash.css">
    <link rel="stylesheet" href="theme/css/style.css">
    <meta name="csrf-token" content="CSRF_PLACEHOLDER" />
    <link rel="shortcut icon" type="image/x-icon" href="https://demo.quizpro.mobi//theme/images/favicon-quizpro.ico">
</head>
<body>
    <div class="content-wrapper">

        <div class="page-header">
            <div class="box-wrapper mx-auto text-center position-relative">
                <a href="index.html" class="page-header-back"><span class="qf-icon-back"></span></a>
                World Map &amp; Flags
            </div>
        </div>

                <div class="container box-wrapper">
            <div class="quiz-thumbnail">

                                    <img src="https://demo.quizpro.mobi//images/category/31/icon/31_01122022_icon_image.png" alt="Quiz">

            </div>

            <div class="quiz-info">
                <h3 class="section-title mb-3">World Map &amp; Flags Quizzes</h3>
                <div class="quiz-info-meta">
                    <div class="row">
                        <div class="col-6">
                            <span class="quiz-info-meta-circle"><span class="qf-icon-ask"></span></span>
                            10 Question
                        </div>
                        <div class="col-6">
                            <span class="quiz-info-meta-circle points"><span class="qf-icon-crown"></span></span>
                            50 Points
                        </div>
                    </div>
                </div>
                <div class="quiz-info-content">
                    <h4 class="quiz-info-content-title">Description</h4>
                    <p>Name of the country, the capital city, president/leader, geography, demography</p>
                </div>

                                                    <a href="#" class="btn btn-lg button-primary w-100" id="btnPlay" gameId="31">Play</a>


            </div>

        </div>

    </div>

    <!-- Category Level Model Start -->
    <div class="modal" tabindex="-1" id="level">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">
                <div class="modal-body modal-level">
                    <div class="modal-level-header">
                        <a href="#" class="modal-level-header-close" data-bs-dismiss="modal" aria-label="Close">
                            <span class="qf-icon-close"></span>
                        </a>
                    </div>
                    <div class="container-fluid box-wrapper">
                        <h3 class="modal-level-title">Difficulty Levels</h3>
                        <div class="modal-level-option" id="search-result">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Category Level Model End -->

    <!-- Login Model Start -->
    <div class="modal fade modal-standard" tabindex="-1" role="dialog" id="modalplay">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header" style="background: #3EA9F5;">
                    <img src="https://demo.quizpro.mobi//theme/images/logo_quizypro.png" width="80" alt="Logo">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">Please login first to continue</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary shadow-sm" data-bs-dismiss="modal" aria-label="Close">Close</button>
                    <a href="login.html" class="btn button-green shadow-sm">Login</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Login Model End -->
    
    <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>
    <script src="theme/js/demo-backend.js"></script>
    <script src="theme/js/i18n.js"></script>
    <script src="theme/js/bootstrap.bundle.min.js"></script>

    <script src="theme/js/custom.js"></script>

</body>
</html>
