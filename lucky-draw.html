<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorQuiz</title>
    <link rel="stylesheet" href="theme/css/bootstrap.min.css">
    <link rel="stylesheet" href="theme/fontello/css/quizy-flash.css">
    <link rel="stylesheet" href="theme/css/style.css">
    <link rel="stylesheet" href="theme/css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="theme/lucky-draw/ld.css">
    <link rel="icon" type="image/svg+xml" href="theme/images/motorquiz-icon.svg">
    <link rel="stylesheet" href="theme/css/motorquiz.css">
</head>
<body class="ld-page">
    <div class="content-wrapper">
        <div class="page-header">
            <div class="box-wrapper mx-auto text-center position-relative">
                <a href="index.html" class="page-header-back"><span class="qf-icon-back"></span></a>
                Prize
            </div>
        </div>

        <div class="container box-wrapper">
            <div class="mq-seg" role="tablist">
                <button type="button" role="tab" data-view="draw">Weekly Lucky Draw</button>
                <button type="button" role="tab" data-view="leaderboard">Monthly Leaderboard</button>
            </div>
            <div id="ld-root"></div>
            <div id="lb-root"></div>
        </div>

        <div class="bottom-spacer" style="height: 65px;"></div>
<div class="bottom-nav">
    <div class="bottom-nav-bg row gx-0 box-wrapper mx-auto container-fluid">
        <div class="col"><div class="nav-box"><a href="index.html" class="nav-box-ico"><svg class="mq-nav-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor"/></svg><span class="nav-label">Play</span></a></div></div>
        <div class="col active"><div class="nav-box"><a href="lucky-draw.html" class="nav-box-ico"><svg class="ld-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/></svg><span class="nav-label">Prize</span></a></div></div>
        <div class="col"><div class="nav-box"><a href="profile.html" class="nav-box-ico"><svg class="mq-nav-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg><span class="nav-label">Account</span></a></div></div>
    </div>
</div>
    </div>

    <!-- Prototype review panel (not part of the product UI) -->
    <button class="ld-review-btn" id="ld-review-btn"><span class="fa fa-sliders"></span> Demo Preview</button>
    <div class="ld-panel" id="ld-panel">
        <button class="ld-panel-close" id="ld-panel-close" aria-label="Close"><span class="qf-icon-close"></span></button>
        <h6>Screen state</h6>
        <div class="ld-chips" id="ld-states"></div>
        <h6>Draw method <span class="ld-flag" style="display:inline">not confirmed</span></h6>
        <select id="ld-method">
            <option value="weighted">Weighted – 1 entry = 1 chance</option>
            <option value="one-per-user">One chance per eligible user</option>
        </select>
        <h6>Pending business rules</h6>
        <ul class="ld-muted ps-3 mb-0" id="ld-pending" style="font-size:.75rem"></ul>
        <p class="ld-muted mt-3 mb-0">Admin view: <a href="lucky-draw-admin.html" style="color:#1F6BFF;font-weight:bold">Lucky Draw admin</a></p>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
    <script src="theme/js/demo-backend.js"></script>
    <script src="theme/js/motorquiz.js"></script>
    <script src="theme/js/i18n.js"></script>
    <script src="theme/js/bootstrap.bundle.min.js"></script>
    <script src="theme/lucky-draw/ld-config.js"></script>
    <script src="theme/lucky-draw/ld-icons.js"></script>
    <script>
    (function () {
        var C = LD_CONFIG, M = MQ.CONFIG, $root = document.getElementById('ld-root'), $lb = document.getElementById('lb-root');
        var STATES = [
            ['guest', 'Guest (not logged in)'],
            ['active', 'Active'],
            ['active-empty', 'Active – 0 entries'],
            ['drawing', 'Drawing in progress'],
            ['completed-win', 'Draw completed – winner'],
            ['completed-lose', 'Draw completed – not won']
        ];
        var params = new URLSearchParams(location.search);
        var state = params.get('state') || (QP_DEMO.user ? 'active' : 'guest');
        var view = location.hash === '#leaderboard' ? 'leaderboard' : 'draw';
        var SPARK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg>';
        var I = window.QP_I18N;
        var grand = C.campaign.prizes[0];

        function flag(text) { return '<span class="mq-tbc">' + text + '</span>'; }
        function shortDate(s) { return LD.fmtDate(s, false, true); }
        function fa(name) { return '<span class="fa ' + name + '"></span>'; }
        function secHead(icon, title, sub) {
            return '<div class="ld-sec-head"><span class="ld-sec-ico">' + icon + '</span>' +
                '<div><h3 class="section-title">' + title + '</h3>' + (sub ? '<div class="ld-sec-sub">' + sub + '</div>' : '') + '</div></div>';
        }
        function entriesWord(n) { return n === 1 ? 'entry' : 'entries'; }

        var st = MQ.stats();
        function totalEntries() { return state === 'active-empty' || state === 'guest' ? 0 : st.entries; }

        // ---------- Hero: the motorbike and the user's entries ----------
        function hero() {
            if (state === 'drawing') return drawingHero();
            var c = C.campaign, guest = state === 'guest', t = totalEntries();
            var cta = guest
                ? '<a href="' + QP_DEMO.loginUrl('lucky-draw.html') + '" class="btn btn-lg button-gold w-100 mt-3">Start Free Trial</a>'
                : MQ.sub() ? '<a href="index.html" class="btn btn-lg button-gold w-100 mt-3"><span class="fa fa-play"></span> Play Now &amp; Earn Entries</a>'
                : '<a href="subscribe.html" class="btn btn-lg button-gold w-100 mt-3">Subscribe Now</a>';
            return '<section class="mq-prize">' +
                    '<span class="mq-prize-value"><small>Worth</small><span>' + MQ.money(grand.value) + '</span></span>' +
                    '<span class="mq-prize-tag"><span class="ld-live-dot"></span> Weekly Grand Prize</span>' +
                    '<div class="mq-prize-title">1 <b>Motorbike</b><br>every week</div>' +
                    '<div class="mq-prize-sub">More entries, more chances to win</div>' +
                    '<img class="mq-prize-bike" src="' + grand.img + '" alt="Motorbike grand prize">' +
                    '<div class="mq-prize-foot">' +
                        '<span><span class="d-block" style="opacity:.75">My entries this week</span><b>' + (guest ? 'Login to join' : t + ' ' + entriesWord(t)) + '</b></span>' +
                        '<span class="text-end"><span class="d-block" style="opacity:.75">Draw in</span><span class="mq-count" id="ld-countdown"></span></span>' +
                    '</div>' +
                    '<div class="mt-2" style="font-size:.75rem;opacity:.85">' + fa('fa-calendar') + ' Draw on ' + shortDate(c.drawDate) + ', ' + new Date(c.drawDate).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + ' ' + flag('date & time TBC') + '</div>' +
                    cta +
                '</section>';
        }

        function tickCountdown() {
            var el = document.getElementById('ld-countdown');
            if (!el) return;
            var s = Math.floor(Math.max(0, new Date(C.campaign.drawDate) - Date.now()) / 1000);
            el.innerHTML = [[Math.floor(s / 86400), 'd'], [Math.floor(s % 86400 / 3600), 'h'], [Math.floor(s % 3600 / 60), 'm']].map(function (p) {
                return '<div><b>' + String(p[0]).padStart(2, '0') + '</b><span>' + p[1] + '</span></div>';
            }).join('');
        }

        // ---------- Drawing in progress ----------
        function myEntryCodes() {
            var codes = [], n = totalEntries();
            for (var i = 0; i < n; i++) codes.push('MQ-' + String(1000 + ((i * 7919 + 3301) % 9000)));
            return codes;
        }
        function drawingHero() {
            var c = C.campaign, t = totalEntries(), codes = myEntryCodes();
            var steps = [['Entries locked', 'done'], ['Eligibility checked', 'done'], ['Drawing the winner', 'now'], ['Winner announced', '']];
            return '<section class="ld-hero ld-hero-drawing">' +
                    '<div class="text-center">' +
                        '<span class="ld-hero-badge" id="ld-draw-badge"><span class="ld-live-dot"></span><span>Drawing now</span></span>' +
                        '<div class="ld-spin-stage"><span class="ld-spin-glow"></span>' +
                            '<span class="ld-spark p1">' + SPARK + '</span><span class="ld-spark p2">' + SPARK + '</span><span class="ld-spark p3">' + SPARK + '</span>' +
                            '<div class="ld-spin-wheel">' + LD_WHEEL_SPIN + '</div>' +
                        '</div>' +
                        '<div class="ld-reel">' + LD_ICON('ticket') + '<span id="ld-reel">MQ-0000</span></div>' +
                        '<h2 class="ld-hero-title text-center" id="ld-draw-title">The motorbike draw is happening!</h2>' +
                        '<p class="ld-hero-sub" id="ld-draw-sub">The winner is being picked at random from all eligible entries.</p>' +
                    '</div>' +
                    '<div class="ld-panel-card">' +
                        '<div class="ld-panel-row">' +
                            '<div class="ld-panel-tickets"><div class="ld-stat-label">My entries in this draw</div><div class="ld-stat-big">' + LD_ICON('ticket') + '<b>' + t + '</b></div></div>' +
                            '<div class="ld-panel-time"><div class="ld-stat-label">Draw date</div><div class="ld-stat-mid">' + LD.fmtDate(c.drawDate) + '</div><span class="ld-tag live">Live</span></div>' +
                        '</div>' +
                        (codes.length ? '<div class="ld-codes">' + codes.map(function (x) { return '<span>' + x + '</span>'; }).join('') + '</div>' : '') +
                        '<ol class="ld-draw-steps">' + steps.map(function (s) {
                            return '<li class="' + s[1] + '"><span>' + (s[1] === 'done' ? fa('fa-check') : s[1] === 'now' ? '<span class="fa fa-circle-o-notch fa-spin"></span>' : '') + '</span>' + s[0] + '</li>';
                        }).join('') + '</ol>' +
                        '<a href="index.html" class="btn btn-lg button-primary w-100 ld-cta" id="ld-draw-cta">Keep Playing</a>' +
                        '<div class="ld-panel-foot">Results appear on this page ' + flag('announcement time TBC') + '</div>' +
                    '</div>' +
                '</section>';
        }
        var reelTimer = null;
        function startReel() {
            clearInterval(reelTimer);
            var el = document.getElementById('ld-reel');
            if (!el) return;
            reelTimer = setInterval(function () { el.textContent = 'MQ-' + String(1000 + Math.floor(Math.random() * 9000)); }, 90);
        }

        // ---------- Draw sequence: spin -> slow down -> stop -> reveal winner ----------
        var drawRun = 0;
        function startDrawSequence() {
            var run = ++drawRun;
            var disc = document.querySelector('.ld-wheel-disc');
            if (!disc) return;
            var codes = myEntryCodes();
            var winCode = codes.length > 2 ? codes[2] : 'MQ-4821';
            var SPEED = 0.72, SPIN_MS = 2600, SLOW_MS = 3400;
            var target = -(1 * 36 + 18);
            var a1 = SPEED * SPIN_MS, extra = SPEED * SLOW_MS / 3;
            var end = a1 + extra + ((((target - (a1 + extra)) % 360) + 360) % 360);
            var t0 = performance.now();
            function frame(now) {
                if (run !== drawRun) return;
                var t = now - t0, angle;
                if (t < SPIN_MS) angle = SPEED * t;
                else if (t < SPIN_MS + SLOW_MS) {
                    var k = (t - SPIN_MS) / SLOW_MS, ease = 1 - Math.pow(1 - k, 3);
                    angle = a1 + (end - a1) * ease;
                } else { disc.style.transform = 'rotate(' + end + 'deg)'; return reveal(run, winCode); }
                disc.style.transform = 'rotate(' + angle + 'deg)';
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        }
        function reveal(run, winCode) {
            if (run !== drawRun) return;
            clearInterval(reelTimer);
            var reel = document.getElementById('ld-reel');
            if (reel) { reel.textContent = winCode; reel.parentNode.classList.add('won'); }
            document.querySelector('.ld-spin-stage').classList.add('stopped');
            var badge = document.getElementById('ld-draw-badge');
            badge.classList.add('done');
            badge.lastChild.textContent = 'Winner selected';
            document.getElementById('ld-draw-title').textContent = 'We have this week\'s winner!';
            document.getElementById('ld-draw-sub').textContent = 'Tap below to see the result.';
            var steps = document.querySelectorAll('.ld-draw-steps li');
            [2, 3].forEach(function (i) {
                if (!steps[i]) return;
                steps[i].className = 'done';
                steps[i].firstChild.innerHTML = '<span class="fa fa-check"></span>';
            });
            var live = document.querySelector('.ld-hero-drawing .ld-tag.live');
            if (live) { live.textContent = 'Done'; live.className = 'ld-tag done'; }
            document.querySelectorAll('.ld-codes span').forEach(function (s) { if (s.textContent === winCode) s.classList.add('won'); });
            var cta = document.getElementById('ld-draw-cta');
            cta.textContent = 'See Winner';
            cta.setAttribute('href', '#');
            cta.onclick = function (e) { e.preventDefault(); state = 'completed-win'; render(); window.scrollTo(0, 0); };
            var stage = document.querySelector('.ld-spin-stage');
            var colors = ['#F6C445', '#FFE08A', '#1F6BFF', '#4C8DFF', '#22B573', '#FFFFFF'];
            for (var i = 0; i < 28; i++) {
                var c = document.createElement('i');
                c.className = 'ld-confetti';
                c.style.background = colors[i % colors.length];
                c.style.setProperty('--x', (Math.random() * 240 - 120) + 'px');
                c.style.setProperty('--y', (Math.random() * -160 - 40) + 'px');
                c.style.setProperty('--r', (Math.random() * 540 - 270) + 'deg');
                c.style.animationDelay = (Math.random() * 0.15) + 's';
                stage.appendChild(c);
            }
        }

        // ---------- How to earn entries (confirmed rules only) ----------
        function howToEarn() {
            var d = MQ.plan('daily'), w = MQ.plan('weekly');
            return '<section class="mq-card">' +
                    '<div class="mq-card-head"><h3 class="mq-card-title">How to get entries</h3></div>' +
                    '<div class="mq-steps">' +
                        '<div class="mq-step"><span class="mq-step-ico"><span class="fa fa-mobile"></span><i>1</i></span><b>Subscribe</b>Daily: ' + d.entries + ' entry<br>Weekly: ' + w.entries + ' entries</div>' +
                        '<div class="mq-step"><span class="mq-step-ico"><span class="fa fa-check"></span><i>2</i></span><b>Answer correctly</b>+' + M.bonus.entries + ' entry every ' + M.bonus.everyCorrect + ' correct</div>' +
                        '<div class="mq-step"><span class="mq-step-ico"><span class="fa fa-trophy"></span><i>3</i></span><b>Win the motorbike</b>Drawn ' + shortDate(C.campaign.drawDate) + '</div>' +
                    '</div>' +
                '</section>';
        }

        // ---------- Entry tracker ----------
        var trackerTab = 'current';
        function tracker() {
            var c = C.campaign, t = totalEntries(), empty = state === 'active-empty';
            var rounds = empty ? [] : st.rounds.filter(function (r) { return r.bonus; });
            var rows = (empty || !st.planEntries ? '' :
                '<li class="history-list"><div class="d-flex w-100 align-items-center">' +
                    '<div class="history-list-pict"><span class="fa fa-mobile"></span></div>' +
                    '<div class="history-list-info"><h4 class="history-list-info-name">Plan entries</h4><div class="history-list-info-stats">Included with your subscription</div></div>' +
                    '<span class="ld-plus">+' + st.planEntries + ' ' + fa('fa-ticket') + '</span></div></li>') +
                rounds.map(function (r) {
                    return '<li class="history-list"><div class="d-flex w-100 align-items-center">' +
                        '<div class="history-list-pict"><span class="fa fa-star"></span></div>' +
                        '<div class="history-list-info"><h4 class="history-list-info-name">Bonus entry</h4>' +
                            '<div class="history-list-info-stats">' + r.correct + ' correct of ' + r.total + ' · +' + r.points + ' points</div>' +
                            '<div class="history-list-date">' + LD.fmtDate(r.date, true) + '</div></div>' +
                        '<span class="ld-plus">+' + r.bonus + ' ' + fa('fa-ticket') + '</span></div></li>';
                }).join('');
            if (!rows) rows = '<li class="ld-empty">' + LD_ICON('ticket') + '<b>No entries yet</b>Subscribe and play to earn your first entry.</li>';
            var current =
                '<div class="ld-track-stats">' +
                    '<div class="main"><span>Total entries</span><b>' + t + '</b></div>' +
                    '<div><span>From plan</span><b>' + (empty ? 0 : st.planEntries) + '</b></div>' +
                    '<div><span>Bonus</span><b>' + (empty ? 0 : st.bonusEntries) + '</b></div>' +
                '</div>' +
                '<div class="ld-track-sub"><span>' + shortDate(c.periodStart) + ' – ' + shortDate(c.periodEnd) + '</span><em>Next bonus: ' + (empty ? 0 : st.progress) + '/' + M.bonus.everyCorrect + ' correct</em></div>' +
                '<ul class="history ld-history">' + rows + '</ul>';
            var past = LD_PAST_PERIODS.map(function (p) {
                var won = /^won/i.test(p.result);
                return '<li class="history-list"><div class="d-flex w-100 align-items-center">' +
                    '<div class="ld-past-ico ' + (won ? 'won' : 'lost') + '">' + fa(won ? 'fa-trophy' : 'fa-calendar-o') + '</div>' +
                    '<div class="history-list-info">' +
                        '<h4 class="history-list-info-name">' + I.f('Week of {d}', { d: shortDate(p.start) }) + '</h4>' +
                        '<div class="history-list-info-stats">' + shortDate(p.start) + ' – ' + LD.fmtDate(p.end) + '</div>' +
                        '<div class="history-list-date">' + I.f('Draw {d}', { d: LD.fmtDate(p.draw) }) + ' · <b class="' + (won ? 'ld-won' : '') + '">' + p.result + '</b></div>' +
                    '</div>' +
                    '<span class="ld-plus zero">' + p.tickets + ' ' + fa('fa-ticket') + '</span>' +
                '</div></li>';
            }).join('');
            return '<section class="card-simple-outer ld-card-outer">' +
                    '<div class="ld-card-pad">' +
                        secHead(LD_ICON('ticket'), 'My Lucky Draw Entries', 'Your entries and where they came from') +
                        '<div class="ld-tabs">' +
                            '<button class="' + (trackerTab === 'current' ? 'on' : '') + '" data-tab="current">This Week</button>' +
                            '<button class="' + (trackerTab === 'history' ? 'on' : '') + '" data-tab="history">Past Draws</button>' +
                        '</div>' +
                    '</div>' +
                    (trackerTab === 'current' ? current : '<ul class="history ld-history">' + past + '</ul>') +
                '</section>';
        }

        // ---------- After the draw ----------
        function winners() {
            var win = state === 'completed-win', t = totalEntries();
            var result = win
                ? '<section class="mq-prize text-center"><img class="mq-prize-bike" src="' + grand.img + '" alt="" style="width:70%"><div class="mq-prize-title">Congratulations,<br>you won the <b>Motorbike</b>!</div>' +
                    '<div class="mq-prize-sub">Worth ' + MQ.money(grand.value) + '. Our team will contact you by SMS. ' + flag('claim process TBC') + '</div></section>'
                : '<section class="ld-result lose"><span class="ld-result-ico">' + LD_ICON('wheel') + '</span><div class="ld-result-title">Not this time</div>' +
                    '<div class="ld-result-text">Your ' + t + ' ' + entriesWord(t) + ' went into this week\'s draw. A new motorbike is up for grabs next week!</div>' +
                    '<a href="index.html" class="btn btn-lg button-primary w-100 ld-cta">Play Now</a></section>';
            return result +
                '<section class="mq-card"><div class="mq-card-head"><h3 class="mq-card-title">This week\'s winner</h3><span class="ld-sec-sub">' + LD.fmtDate(C.campaign.drawDate, true) + '</span></div>' +
                    '<ul class="mq-lb"><li class="' + (win ? 'me' : '') + '"><span class="mq-lb-rank r1">1</span>' +
                        '<span class="mq-lb-name"><b>' + (win ? 'You' : '012•••4821') + (win ? '<span class="mq-you">You</span>' : '') + '</b><small>Grand Prize · Motorbike</small></span>' +
                        '<span class="mq-cash">' + MQ.money(grand.value) + '</span></li></ul>' +
                '</section>';
        }

        function terms() {
            return '<details class="card-simple ld-card ld-terms"><summary>' + fa('fa-file-text-o') + ' Terms &amp; Conditions</summary><ol>' +
                    '<li>1 motorbike worth ' + MQ.money(grand.value) + ' is given away every week.</li>' +
                    '<li>Daily Plan gives 1 entry, Weekly Plan gives 7 entries, and every 5 correct answers give 1 more entry.</li>' +
                    '<li>The winner is selected at random from eligible entries on the draw date.' + flag('draw method TBC') + '</li>' +
                    '<li>Open to active MotorQuiz subscribers.' + flag('eligibility TBC') + '</li>' +
                    '<li>Entries count for the week they were earned.' + flag('TBC') + '</li>' +
                    '<li>Entries are not transferable and cannot be exchanged for cash.</li>' +
                '</ol></details>';
        }

        // ---------- Monthly leaderboard ----------
        function leaderboard() {
            var list = MQ.leaderboard(), me = list.filter(function (p) { return p.me; })[0], top = list.slice(0, M.leaderboardPrizes.length);
            var now = new Date(), end = new Date(now.getFullYear(), now.getMonth() + 1, 1), days = Math.ceil((end - now) / 864e5);
            function row(p) {
                return '<li class="' + (p.me ? 'me' : '') + '"><span class="mq-lb-rank' + (p.rank <= 3 ? ' r' + p.rank : '') + '">' + p.rank + '</span>' +
                    (p.me ? '<img class="mq-lb-ava" src="' + QP_DEMO.USER_AVATAR + '" alt="">' : '<span class="mq-lb-ava" style="background:' + p.color + ';color:#fff"><span class="qf-icon-profile"></span></span>') +
                    '<span class="mq-lb-name"><b>' + p.name + (p.me ? '<span class="mq-you">You</span>' : '') + '</b><small>' + p.points.toLocaleString('en-US') + ' points</small></span>' +
                    '<span class="mq-cash' + (p.prize ? '' : ' none') + '">' + (p.prize ? MQ.money(p.prize) : '–') + '</span></li>';
            }
            var mine = me ? (me.rank <= top.length ? '' : '<li class="mq-lb-gap">• • •</li>' + row(me)) : '';
            var myCard = me
                ? '<div class="mq-sub mb-3"><span class="mq-sub-ico"><span class="fa fa-line-chart"></span></span><div class="mq-sub-text"><b>You are #' + me.rank + ' this month</b><small>' +
                    (me.rank <= top.length ? 'You\'re in the cash prizes. Keep playing to stay there!' : (top[top.length - 1].points - me.points + 1) + ' more points to reach the Top ' + top.length) + '</small></div></div>'
                : '<a href="' + QP_DEMO.loginUrl('lucky-draw.html') + '" class="btn btn-lg button-primary w-100 mb-3">Login to join the leaderboard</a>';
            return '<section class="mq-card">' +
                    '<h3 class="mq-card-title">Monthly Cash Prizes</h3><div class="ld-sec-sub mb-3">' + now.toLocaleString('en-GB', { month: 'long', year: 'numeric' }) + ' · ' + days + ' day' + (days === 1 ? '' : 's') + ' left</div>' +
                    '<div class="mq-cash-grid">' + M.leaderboardPrizes.map(function (v, i) { return '<div><small>' + ['1st', '2nd', '3rd', '4th', '5th'][i] + '</small><b>' + MQ.money(v) + '</b></div>'; }).join('') + '</div>' +
                    myCard +
                    '<div class="mq-card-head mt-2"><h3 class="mq-card-title">Top ' + top.length + '</h3><a class="mq-card-link" href="leaderboard.html">Full leaderboard <span class="fa fa-angle-right"></span></a></div>' +
                    '<ul class="mq-lb">' + top.map(row).join('') + mine + '</ul>' +
                    '<p class="ld-muted mt-3 mb-0" style="font-size:.75rem">Ranked by points this month: 1 point for every correct answer. ' + flag('tie-break & payout TBC') + '</p>' +
                '</section>';
        }

        function render() {
            document.querySelectorAll('.mq-seg button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-view') === view); b.setAttribute('aria-selected', b.getAttribute('data-view') === view); });
            $lb.innerHTML = view === 'leaderboard' ? leaderboard() : '';
            document.getElementById('ld-review-btn').hidden = view !== 'draw';
            if (view !== 'draw') { $root.innerHTML = ''; drawRun++; clearInterval(reelTimer); return; }
            var html;
            if (state === 'guest') html = hero() + howToEarn();
            else if (state === 'drawing') html = hero() + tracker();
            else if (state.indexOf('completed') === 0) html = winners() + tracker();
            else html = hero() + howToEarn() + tracker();
            $root.innerHTML = html + terms();
            startReel();
            if (state === 'drawing') startDrawSequence(); else drawRun++;
            tickCountdown();
            renderPanel();
            var u = new URL(location.href);
            u.searchParams.set('state', state);
            try { window.history.replaceState(null, '', u); } catch (e) {}
        }

        // ---------- Prototype review panel ----------
        function renderPanel() {
            document.getElementById('ld-states').innerHTML = STATES.map(function (s) {
                return '<button class="ld-chip' + (s[0] === state ? ' on' : '') + '" data-state="' + s[0] + '">' + s[1] + '</button>';
            }).join('');
            document.getElementById('ld-method').value = C.drawMethod.type;
            document.getElementById('ld-pending').innerHTML = M.pending.map(function (p) { return '<li>' + p.label + '</li>'; }).join('');
        }
        document.querySelector('.mq-seg').addEventListener('click', function (e) {
            var b = e.target.closest('[data-view]'); if (!b) return;
            view = b.getAttribute('data-view');
            try { history.replaceState(null, '', location.pathname + location.search + (view === 'leaderboard' ? '#leaderboard' : '')); } catch (x) {}
            render();
        });
        $root.addEventListener('click', function (e) {
            var b = e.target.closest('[data-tab]'); if (!b) return;
            trackerTab = b.getAttribute('data-tab'); render();
        });
        document.getElementById('ld-states').addEventListener('click', function (e) {
            var b = e.target.closest('[data-state]'); if (!b) return;
            state = b.getAttribute('data-state'); render();
        });
        document.getElementById('ld-method').addEventListener('change', function () { C.drawMethod.type = this.value; render(); });
        var panel = document.getElementById('ld-panel');
        document.getElementById('ld-review-btn').onclick = function () { panel.classList.add('open'); };
        document.getElementById('ld-panel-close').onclick = function () { panel.classList.remove('open'); };

        render();
        setInterval(tickCountdown, 30000);
    })();
    </script>
</body>
</html>
