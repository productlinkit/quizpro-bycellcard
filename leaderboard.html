<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorQuiz</title>
    <link rel="stylesheet" href="theme/css/bootstrap.min.css">
    <link rel="stylesheet" href="theme/fontello/css/quizy-flash.css">
    <link rel="stylesheet" href="theme/css/style.css">
    <link rel="stylesheet" href="theme/css/app.css">
    <link rel="stylesheet" href="theme/css/leaderboard.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta name="csrf-token" content="CSRF_PLACEHOLDER" />
    <link rel="icon" type="image/png" href="theme/images/motorquiz-icon.png">
    <link rel="stylesheet" href="theme/lucky-draw/ld.css">
    <link rel="stylesheet" href="theme/css/motorquiz.css">
</head>
<body>
    
    
    <div class="content-wrapper">
        <div class="page-header">
            <div class="box-wrapper mx-auto text-center position-relative">
                <a href="lucky-draw.html" class="page-header-back" aria-label="Back to Prize"><span class="qf-icon-back"></span></a>
                Monthly Leaderboard
            </div>
        </div>

        <div class="container box-wrapper">
            <!-- Prize pool, reset countdown, cash per rank -->
            <section class="mq-pool" id="lbPool"></section>
            <!-- Top 3 -->
            <section class="mq-stage" id="lbPodium"></section>

            <div class="lb-search">
                <span class="qf-icon-search"></span>
                <input type="search" id="lbSearch" inputmode="numeric" autocomplete="off" placeholder="Search phone number..." aria-label="Find Player">
            </div>
            <div class="lb-empty" id="lbEmpty" hidden></div>
            <div class="card-simple-outer lb-list mq-full"><ul class="mq-rows" id="lbList"></ul></div>
        </div>

        <!-- Your rank, always visible above the nav -->
        <div class="mq-mybar" id="lbMe"></div>
        <div class="bottom-spacer" style="height: 150px;"></div>
<div class="bottom-nav">
    <div class="bottom-nav-bg row gx-0 box-wrapper mx-auto container-fluid">
        <div class="col">
            <div class="nav-box">
                <a href="index.html" class="nav-box-ico"><span class="qf-icon-game"></span><span class="nav-label">Play</span></a>
            </div>
        </div>
        <div class="col active">
            <div class="nav-box">
                <a href="lucky-draw.html" class="nav-box-ico"><svg class="ld-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7M12 8v13M12 8S10.6 3.4 7.9 3.7C5.9 4 6.2 7.5 9 8M12 8s1.4-4.6 4.1-4.3c2 .3 1.7 3.8-1.1 4.3"/></svg><span class="nav-label">Prize</span></a>
            </div>
        </div>
        <div class="col">
            <div class="nav-box">
                <a href="profile.html" class="nav-box-ico"><span class="qf-icon-profile"></span><span class="nav-label">Account</span></a>
            </div>
        </div>
    </div>
</div> </div>

    <!-- language option model -->
    <div class="modal fade modal-standard" tabindex="-1" role="dialog" id="modalLang">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header" style="background: #3EA9F5;">
                    <img class="mq-logo-img" src="theme/images/motorquiz-logo-white.png" alt="MotorQuiz">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <select name="lang" id="lang" style="font-size: 20px;">
                                            <option value="sdfg">English</option>
                                            <option value="ar">Arabic</option>
                                            <option value="fr">French </option>
                                    </select>
            </div>
        </div>
    </div>
    <!-- language option model -->

    <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>
    <script src="theme/js/demo-backend.js"></script>
    <script src="theme/js/motorquiz.js"></script>
    <script src="theme/js/i18n.js"></script>
    <script src="theme/js/bootstrap.bundle.min.js"></script>

    <script src="theme/js/custom.js"></script>
    <script src="theme/lucky-draw/ld-icons.js"></script>
    <script>
    // Monthly leaderboard: prize pool, podium for the top 3, everyone else below, your rank pinned (rules in motorquiz.js)
    (function () {
        var M = MQ.CONFIG, P = M.leaderboardPrizes, N = P.length, list = MQ.leaderboard(), me = list.filter(function (p) { return p.me; })[0];
        var now = new Date(), reset = new Date(now.getFullYear(), now.getMonth() + 1, 1);
        function $(id) { return document.getElementById(id); }
        function esc(x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
        function ava(p, cls) { return '<span class="' + cls + '">' + (p.me ? '<img src="' + QP_DEMO.USER_AVATAR + '" alt="">' : '<span style="background:' + p.color + '"><span class="qf-icon-profile"></span></span>') + '</span>'; }
        function you(p) { return p.me ? ' <em class="mq-lb-you">You</em>' : ''; }
        function pts(p) { return p.points.toLocaleString('en-US') + ' pts'; }

        // Prize pool + live countdown to the monthly reset
        var pool = P.reduce(function (a, b) { return a + b; }, 0);
        var SPARK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg>';
        $('lbPool').innerHTML = '<span class="mq-pool-deco" aria-hidden="true"></span><span class="mq-pool-shine" aria-hidden="true"></span>' +
            '<span class="mq-spark s1">' + SPARK + '</span><span class="mq-spark s2">' + SPARK + '</span><span class="mq-spark s3">' + SPARK + '</span>' +
            '<div class="mq-pool-top"><div><span class="mq-pool-label">' + now.toLocaleString('en-GB', { month: 'long', year: 'numeric' }) + ' prize pool</span><b class="mq-pool-total">' + MQ.money(pool) + '</b></div>' +
                '<span class="mq-pool-trophy" aria-hidden="true">' + LD_ICON('trophy') + '</span></div>' +
            '<div class="mq-pool-count"><span>Resets in</span><span class="mq-tiles" id="lbCount"></span></div>' +
            '<div class="mq-pool-prizes">' + P.map(function (v, i) { return '<div><small>' + ['1st', '2nd', '3rd', '4th', '5th'][i] + '</small><b>' + MQ.money(v) + '</b></div>'; }).join('') + '</div>';
        function tick() {
            var s = Math.max(0, Math.floor((reset - Date.now()) / 1000));
            $('lbCount').innerHTML = [[s / 86400, 'd'], [s % 86400 / 3600, 'h'], [s % 3600 / 60, 'm']].map(function (x) { return '<span><b>' + String(Math.floor(x[0])).padStart(2, '0') + '</b>' + x[1] + '</span>'; }).join('');
        }
        tick(); setInterval(tick, 30000);

        // Podium (2 - 1 - 3)
        $('lbPodium').innerHTML = '<span class="mq-beam b1" aria-hidden="true"></span><span class="mq-beam b2" aria-hidden="true"></span><span class="mq-beam b3" aria-hidden="true"></span>' +
            '<span class="mq-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>' +
            '<div class="mq-podium">' + [list[1], list[0], list[2]].map(function (p) {
            return '<div class="mq-pod r' + p.rank + (p.me ? ' is-me' : '') + '">' + (p.rank === 1 ? '<span class="mq-pod-crown qf-icon-crown" aria-hidden="true"></span>' : '') +
                ava(p, 'mq-pod-ava') + '<span class="mq-pod-name">' + esc(p.name) + you(p) + '</span><span class="mq-pod-pts">' + pts(p) + '</span>' +
                '<span class="mq-pod-cash">' + MQ.money(p.prize) + '</span><span class="mq-pod-step"><b>' + p.rank + '</b></span></div>';
        }).join('') + '</div>';

        // Everyone from rank 4: cash zone first, then a divider, then the rest
        // (ranks 1-3 are in the list too, hidden until a search needs them)
        $('lbList').innerHTML = list.map(function (p) {
            var row = '<li class="leaderboard-winner' + (p.rank <= 3 ? ' is-pod' : '') + (p.me ? ' is-me' : '') + (p.prize ? ' is-cash' : '') + '" style="--i:' + Math.max(0, p.rank - 4) + '"><span class="mq-row-rank">' + p.rank + '</span>' + ava(p, 'mq-row-ava') +
                '<span class="mq-row-name"><span class="leaderboard-winner-info-name">' + esc(p.name) + you(p) + '</span><small>' + pts(p) + '</small></span>' +
                (p.prize ? '<span class="mq-row-cash">' + MQ.money(p.prize) + '</span>' : p.me ? '<span class="mq-row-gap">' + (list[N - 1].points - p.points + 1) + ' pts to Top ' + N + '</span>' : '') + '</li>';
            return row + (p.rank === N ? '<li class="mq-zone" aria-hidden="true"><span>Cash prize zone</span></li>' : '');
        }).join('');

        // Your rank bar
        if (me) {
            var inTop = me.rank <= N, need = list[N - 1].points - me.points + 1;
            $('lbMe').innerHTML = '<div class="box-wrapper mx-auto mq-mybar-in">' + ava(me, 'mq-row-ava') +
                '<div class="mq-mybar-main"><b>#' + me.rank + ' · ' + pts(me) + '</b><small>' + (inTop ? 'You\'re winning ' + MQ.money(me.prize) + '. Keep it up!' : need + ' more points to reach the Top ' + N) + '</small>' +
                '<span class="mq-me-bar"><i style="width:' + (inTop ? 100 : Math.max(6, Math.round(me.points / list[N - 1].points * 100))) + '%"></i></span></div>' +
                '<a href="index.html#play" class="btn button-primary mq-mybar-btn"><span class="fa fa-play"></span> Play</a></div>';
        } else $('lbMe').innerHTML = '<div class="box-wrapper mx-auto mq-mybar-in"><div class="mq-mybar-main"><b>Join the leaderboard</b><small>Every correct answer = 1 point</small></div>' +
            '<a href="' + QP_DEMO.loginUrl('leaderboard.html') + '" class="btn button-primary mq-mybar-btn">Login</a></div>';

        // While searching, the podium steps aside so matches are easy to see
        $('lbSearch').addEventListener('input', function () {
            var on = !!this.value.trim();
            $('lbPodium').hidden = on;
            document.querySelector('.mq-full').classList.toggle('searching', on);
        });
    })();
    </script>
    <script src="theme/js/search-suggest.js?v=3"></script>

</body>
</html>
