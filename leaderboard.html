<body>
    
    
    <div class="content-wrapper">
        <div class="container box-wrapper">
            <div class="header">
                <div class="row align-items-center">
                    <div class="col-6 text-start">
                        <div class="logo">
                            <a href="index.html">
                                <span class="mq-logo"><svg class="mq-logo-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#1F6BFF"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="44.8 15" transform="rotate(135 16 16)"/><path d="M16 16 L21.5 10.5" stroke="#F6C445" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="2.8" fill="#F6C445"/><path d="M21.5 21.5 L26 26" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg><span>Motor<b>Quiz</b></span></span>
                            </a>
                        </div>
                    </div>






                </div>
            </div>


    <h2 class="lb-title">Monthly Leaderboard</h2>
    <p class="mq-page-sub" id="lbMonth"></p>
    <div class="lb-search">
        <span class="qf-icon-search"></span>
        <input type="search" id="lbSearch" inputmode="numeric" autocomplete="off" placeholder="Search phone number..." aria-label="Find Player">
    </div>
    <div class="lb-empty" id="lbEmpty" hidden></div>
    <div class="mq-card lb-list">
        <div class="mq-cash-grid" id="lbCash"></div>
        <ul class="mq-lb leaderboard" id="lbList"></ul>
        <p class="mb-0 mt-2" style="font-size:.75rem;color:var(--mq-muted)">1 point for every correct answer this month. Top 5 win cash prizes. <span class="mq-tbc">tie-break &amp; payout TBC</span></p>
    </div>


        </div>


        <div class="bottom-spacer" style="height: 65px;"></div>
<div class="bottom-nav">

</div> </div>

    <!-- language option model -->
    <div class="modal fade modal-standard" tabindex="-1" role="dialog" id="modalLang">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header" style="background: #1F6BFF;">
                    <span class="mq-logo"><svg class="mq-logo-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#1F6BFF"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="44.8 15" transform="rotate(135 16 16)"/><path d="M16 16 L21.5 10.5" stroke="#F6C445" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="2.8" fill="#F6C445"/><path d="M21.5 21.5 L26 26" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg><span>Motor<b>Quiz</b></span></span>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <select name="lang" id="lang" style="font-size: 20px;">
                                            <option value="sdfg">English</option>
                                            <option value="ar">Arabic</option>
                                            <option value="fr">French </option>
                                    </select>
            </div>
        </div>
    </div>
    <!-- language option model -->

    <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>
    <script src="theme/js/demo-backend.js"></script>
    <script src="theme/js/motorquiz.js"></script>
    <script src="theme/js/i18n.js"></script>
    <script src="theme/js/bootstrap.bundle.min.js"></script>

    <script src="theme/js/custom.js"></script>
    <script>
    (function () {
        var M = MQ.CONFIG, list = MQ.leaderboard(), now = new Date();
        document.getElementById('lbMonth').textContent = now.toLocaleString('en-GB', { month: 'long', year: 'numeric' }) + ' · resets on the 1st';
        document.getElementById('lbCash').innerHTML = M.leaderboardPrizes.map(function (v, i) { return '<div><small>' + ['1st', '2nd', '3rd', '4th', '5th'][i] + '</small><b>' + MQ.money(v) + '</b></div>'; }).join('');
        document.getElementById('lbList').innerHTML = list.map(function (p) {
            return '<li class="leaderboard-winner' + (p.me ? ' me is-you' : '') + '"><span class="mq-lb-rank' + (p.rank <= 3 ? ' r' + p.rank : '') + '">' + p.rank + '</span>' +
                (p.me ? '<img class="mq-lb-ava" src="' + QP_DEMO.USER_AVATAR + '" alt="">' : '<span class="mq-lb-ava" style="background:' + p.color + ';color:#fff"><span class="qf-icon-profile"></span></span>') +
                '<span class="mq-lb-name"><b class="leaderboard-winner-info-name">' + p.name + (p.me ? '<span class="mq-you lb-you">You</span>' : '') + '</b><small>' + p.points.toLocaleString('en-US') + ' points</small></span>' +
                '<span class="mq-cash' + (p.prize ? '' : ' none') + '">' + (p.prize ? MQ.money(p.prize) : '–') + '</span></li>';
        }).join('');
    })();
    </script>
    <script src="theme/js/search-suggest.js?v=3"></script>

</html>
