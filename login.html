<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorQuiz</title>
    <link rel="stylesheet" href="theme/css/bootstrap.min.css">
    <link rel="stylesheet" href="theme/fontello/css/quizy-flash.css">
    <link rel="stylesheet" href="theme/css/style.css">
    <link rel="stylesheet" href="theme/css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="icon" type="image/svg+xml" href="theme/images/motorquiz-icon.svg">

    <link rel="stylesheet" href="theme/css/motorquiz.css">
</head>
<body class="login">
    <div class="content-wrapper">
        <div class="container box-wrapper">
            <div class="text-center pt-4 pb-4 text-white">
                <span class="mq-logo lg mb-3"><svg class="mq-logo-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#1F6BFF"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="44.8 15" transform="rotate(135 16 16)"/><path d="M16 16 L21.5 10.5" stroke="#F6C445" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="2.8" fill="#F6C445"/><path d="M21.5 21.5 L26 26" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg><span>Motor<b>Quiz</b></span></span>
                <img src="theme/images/motorbike.svg" alt="" style="display:block;width:180px;margin:0 auto 10px;filter:drop-shadow(0 12px 12px rgba(0,0,0,.35))">
                <p class="mb-0 fw-bold">Login with your Cellcard number</p>
                <p class="mb-0 small" style="opacity:.8">Then choose a plan and start playing</p>
            </div>
                        <div class="card-simple">
                <form action="#" class="form" method="post">
                    <input type="hidden" name="_token" value="CSRF_PLACEHOLDER">
                                        <div class="mb-3">
                        <input type="number" class="form-control shadow-sm" name="msisdn" placeholder="Cellcard number (MSISDN)" id="msisdn" value="">
                        <small class="text-danger"></small>
                    </div>
                    <div class="mb-3">
                        <div class="position-relative">
                            <input type="password" name="password" class="form-control shadow-sm" placeholder="Password" id="password" value="" style="padding-right:3rem">
                            <button type="button" id="togglePassword" aria-label="Show password" style="position:absolute;top:0;right:0;height:100%;width:3rem;border:0;background:none;color:#969696">
                                <span class="fa fa-eye"></span>
                            </button>
                        </div>
                        <small class="text-danger"></small>
                    </div>

                    <input type="submit" class="btn btn-lg button-primary w-100" value="Login" >
                    <a href="index.html" class="d-block text-center mt-3 fw-bold" style="color:#969696">Browse as guest</a>

                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>
    <script src="theme/js/demo-backend.js"></script>
    <script src="theme/js/motorquiz.js"></script>
    <script src="theme/js/i18n.js"></script>
    <script src="theme/js/bootstrap.bundle.min.js"></script>

    <script src="theme/js/custom.js"></script>
    <script>
        document.getElementById('togglePassword').addEventListener('click', function () {
            var input = document.getElementById('password'), show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            this.querySelector('.fa').className = 'fa ' + (show ? 'fa-eye-slash' : 'fa-eye');
            this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
    </script>

</body>
</html>
