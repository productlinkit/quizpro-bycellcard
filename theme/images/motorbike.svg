<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset=".55" stop-color="#1F6BFF"/>
      <stop offset="1" stop-color="#0D3CA8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6FB"/>
      <stop offset="1" stop-color="#9AA6BF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#E0A21E"/>
    </linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="162" cy="192" rx="138" ry="12" fill="url(#shadow)"/>

  <!-- rear wheel -->
  <g>
    <circle cx="78" cy="156" r="36" fill="#121A33"/>
    <circle cx="78" cy="156" r="25" fill="url(#chrome)"/>
    <circle cx="78" cy="156" r="19" fill="#1B2547"/>
    <g stroke="url(#gold)" stroke-width="4" stroke-linecap="round">
      <path d="M78 139v34M61 156h34M66 144l24 24M90 144l-24 24"/>
    </g>
    <circle cx="78" cy="156" r="6" fill="url(#gold)"/>
  </g>

  <!-- front wheel -->
  <g>
    <circle cx="250" cy="156" r="36" fill="#121A33"/>
    <circle cx="250" cy="156" r="25" fill="url(#chrome)"/>
    <circle cx="250" cy="156" r="19" fill="#1B2547"/>
    <g stroke="url(#gold)" stroke-width="4" stroke-linecap="round">
      <path d="M250 139v34M233 156h34M238 144l24 24M262 144l-24 24"/>
    </g>
    <circle cx="250" cy="156" r="6" fill="url(#gold)"/>
  </g>

  <!-- front fork -->
  <path d="M226 66 L250 156" stroke="url(#chrome)" stroke-width="9" stroke-linecap="round"/>

  <!-- exhaust -->
  <path d="M84 150 L156 141 C162 140 166 146 162 151 L90 162 C82 163 78 152 84 150 Z" fill="url(#chrome)" stroke="#6F7C99" stroke-width="1.5"/>

  <!-- engine block -->
  <path d="M118 124 H168 L176 150 H126 Z" fill="#26304F"/>
  <path d="M128 132 H164 M130 140 H168" stroke="#3B476B" stroke-width="3" stroke-linecap="round"/>

  <!-- rear body panel -->
  <path d="M34 118 C40 92 70 80 108 82 L176 88 C190 89 198 100 200 114 L202 128 H124 C116 112 98 104 80 104 C58 104 44 114 40 128 Z" fill="url(#body)"/>
  <path d="M46 108 C58 92 84 88 110 89 L170 93" stroke="url(#shine)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- rear fender -->
  <path d="M36 140 C40 112 62 100 84 100 C104 100 120 112 124 128" stroke="#0D3CA8" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- tail light -->
  <path d="M30 112 L42 106 L44 118 L32 122 Z" fill="#FF5A5F"/>

  <!-- seat -->
  <path d="M62 82 C70 68 128 66 160 74 C168 76 170 84 164 88 L70 90 C62 90 58 86 62 82 Z" fill="#0F1530"/>
  <path d="M74 76 C96 70 132 70 156 76" stroke="#3A4466" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- gold stripe -->
  <path d="M66 112 C92 104 140 104 196 112" stroke="url(#gold)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- floorboard -->
  <path d="M122 128 H204 L212 142 H128 Z" fill="#1B2547"/>

  <!-- front apron / leg shield -->
  <path d="M198 132 C200 104 208 80 216 58 L236 62 C230 88 228 112 230 136 Z" fill="url(#body)"/>
  <path d="M214 66 C210 86 206 104 205 124" stroke="url(#shine)" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- front fender -->
  <path d="M220 134 C226 116 274 116 282 134" stroke="#0D3CA8" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- handlebar & headlight -->
  <path d="M208 50 L246 42" stroke="#121A33" stroke-width="7" stroke-linecap="round"/>
  <path d="M212 56 C220 44 240 42 246 52 L240 66 C232 62 222 62 214 66 Z" fill="url(#body)"/>
  <ellipse cx="244" cy="60" rx="8" ry="9" fill="#FFF6D6" stroke="url(#gold)" stroke-width="3"/>
  <!-- mirror -->
  <path d="M214 48 L206 28" stroke="#121A33" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="204" cy="24" rx="7" ry="5" fill="#121A33"/>
</svg>
