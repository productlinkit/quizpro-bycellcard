    <script>
        // Home: members see how many Lucky Draw tickets they have collected
        (function () {
            var el = document.getElementById('homeTicketCount');
            if (!QP_DEMO.user) { document.getElementById('homeTickets').href = QP_DEMO.loginUrl('index.html'); el.textContent = 'Login to earn Lucky Draw tickets'; return; }
            var n = LD_DEMO_ACTIVITY.reduce(function (t, a) { return t + LD.ticketsFor(a, LD_CONFIG.ticketRule); }, 0);
            el.textContent = n + ' ticket' + (n === 1 ? '' : 's');
        })();
    </script>
    <script>
        // Daily Competition card: countdown to the next challenge, tilt and owl eyes follow the pointer, tap effects
        (function () {
            var card = document.getElementById('quickPlay'), ill = card.querySelector('.comp-ill'), btn = card.querySelector('.comp-btn');
            var eyes = card.querySelector('.owl-pupils'), clock = document.getElementById('compCountdown');
            function tick() {
                var now = new Date(), end = new Date(now); end.setHours(24, 0, 0, 0);
                var s = Math.floor((end - now) / 1000);
                clock.textContent = [s / 3600, s / 60 % 60, s % 60].map(function (n) { return String(Math.floor(n)).padStart(2, '0'); }).join(':');
            }
            tick(); setInterval(tick, 1000);
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            function follow(e) {
                var r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
                card.style.setProperty('--px', x.toFixed(3));
                card.style.setProperty('--py', y.toFixed(3));
                card.classList.add('is-live');
                eyes.style.transform = 'translate(' + (x * 5).toFixed(1) + 'px,' + ((y + 0.2) * 4).toFixed(1) + 'px)';
            }
            function rest() {
                card.classList.remove('is-live');
                card.style.removeProperty('--px'); card.style.removeProperty('--py');
                eyes.style.transform = '';
            }
            card.addEventListener('pointermove', follow);
            card.addEventListener('pointerdown', follow);
            card.addEventListener('pointerleave', rest);
            card.addEventListener('pointercancel', rest);
            ill.addEventListener('click', function (e) {
                e.preventDefault(); e.stopPropagation();
                card.classList.remove('hop'); void card.offsetWidth; card.classList.add('hop');
            });
            ill.addEventListener('animationend', function (e) { if (e.animationName === 'owlJump') card.classList.remove('hop'); });
            btn.addEventListener('pointerdown', function (e) {
                var r = btn.getBoundingClientRect(), w = document.createElement('i');
                w.className = 'comp-ripple';
                w.style.left = (e.clientX - r.left) + 'px'; w.style.top = (e.clientY - r.top) + 'px';
                btn.appendChild(w);
                setTimeout(function () { w.remove(); }, 600);
            });
        })();
    </script>
