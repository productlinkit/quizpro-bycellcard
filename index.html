    <script>
        // Home: plan status, questions left, points and Lucky Draw entries (rules in theme/js/motorquiz.js)
        (function () {
            var C = MQ.CONFIG, user = QP_DEMO.user, s = user && MQ.sub(), st = MQ.stats();
            function $(id) { return document.getElementById(id); }
            var pts = document.querySelector('.home-profile-points');
            if (pts) pts.lastChild.textContent = ' ' + st.points.toLocaleString('en-US');
            if (!user) {
                $('homeTickets').href = QP_DEMO.loginUrl('index.html');
                $('homeTicketCount').textContent = 'Login to earn Lucky Draw entries';
                $('compBtn').textContent = 'Start Free Trial';
                return;
            }
            document.querySelectorAll('.home-profile-status').forEach(function (el) { el.textContent = s ? (s.plan.trial ? 'Free Trial' : s.plan.name) : 'No active plan'; });
            $('homeTicketTitle').textContent = st.entries + ' Lucky Draw entr' + (st.entries === 1 ? 'y' : 'ies');
            $('homeTicketCount').textContent = 'Next bonus entry: ' + st.progress + '/' + C.bonus.everyCorrect + ' correct';
            if (!s) {
                $('compBtn').textContent = MQ.trialAvailable() ? 'Start Free Trial' : 'Subscribe Now';
                $('compPlan').textContent = 'Choose a plan to play';
                return;
            }
            $('compQs').textContent = s.left + '/' + s.plan.questions + ' questions left';
            $('compPlan').innerHTML = (s.plan.trial ? 'Free 1-Day Trial' : s.plan.name) + ' · ' + st.points.toLocaleString('en-US') + ' points · ' + st.entries + ' entries';
            if (!s.left) $('compBtn').textContent = 'All questions played';
        })();
    </script>
    <script>
        // Daily Competition card: countdown to the next challenge, tilt and the bike's headlight eye follows the pointer, tap effects
        (function () {
            var card = document.getElementById('quickPlay'), ill = card.querySelector('.comp-ill'), btn = card.querySelector('.comp-btn');
            var eyes = card.querySelector('.bike-eye'), clock = document.getElementById('compCountdown');
            function tick() {
                var now = new Date(), end = new Date(now), sub = window.MQ && QP_DEMO.user && MQ.sub(); end.setHours(24, 0, 0, 0);
                if (sub) end = new Date(sub.periodEnd);
                var s = Math.floor((end - now) / 1000);
                clock.textContent = [s / 3600, s / 60 % 60, s % 60].map(function (n) { return String(Math.floor(n)).padStart(2, '0'); }).join(':');
            }
            tick(); setInterval(tick, 1000);
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            function follow(e) {
                var r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
                card.style.setProperty('--px', x.toFixed(3));
                card.style.setProperty('--py', y.toFixed(3));
                card.classList.add('is-live');
                eyes.style.transform = 'translate(' + (x * 5).toFixed(1) + 'px,' + ((y + 0.2) * 4).toFixed(1) + 'px)';
            }
            function rest() {
                card.classList.remove('is-live');
                card.style.removeProperty('--px'); card.style.removeProperty('--py');
                eyes.style.transform = '';
            }
            card.addEventListener('pointermove', follow);
            card.addEventListener('pointerdown', follow);
            card.addEventListener('pointerleave', rest);
            card.addEventListener('pointercancel', rest);
            ill.addEventListener('click', function (e) {
                e.preventDefault(); e.stopPropagation();
                card.classList.remove('hop'); void card.offsetWidth; card.classList.add('hop');
            });
            ill.addEventListener('animationend', function (e) { if (e.animationName === 'bikeWheelie') card.classList.remove('hop'); });
            btn.addEventListener('pointerdown', function (e) {
                var r = btn.getBoundingClientRect(), w = document.createElement('i');
                w.className = 'comp-ripple';
                w.style.left = (e.clientX - r.left) + 'px'; w.style.top = (e.clientY - r.top) + 'px';
                btn.appendChild(w);
                setTimeout(function () { w.remove(); }, 600);
            });
        })();
    </script>
