    <script>
        // Home: plan status and questions left (rules in theme/js/motorquiz.js)
        (function () {
            var nav = performance.getEntriesByType('navigation')[0];
            if (QP_DEMO.user && nav && nav.type === 'reload') MQ.demoRefill();   // demo: refresh = questions refilled
            var user = QP_DEMO.user, s = user && MQ.sub(), st = MQ.stats();
            function $(id) { return document.getElementById(id); }
            var pts = document.querySelector('.home-profile-points');
            if (pts) pts.lastChild.textContent = ' ' + st.points.toLocaleString('en-US');
            if (!user) { $('compBtn').textContent = 'Start Free Trial'; $('compFuelBox').hidden = true; return; }
            document.querySelectorAll('.home-profile-status').forEach(function (el) { el.textContent = s ? (s.plan.trial ? 'Free Trial' : s.plan.name) : 'No active plan'; });
            if (!s) { $('compBtn').textContent = MQ.trialAvailable() ? 'Start Free Trial' : 'Subscribe Now'; $('compFuelBox').hidden = true; return; }
            // Questions left shown as a fuel gauge
            $('compQs').textContent = s.left + '/' + s.plan.questions;
            $('compFuel').style.width = Math.round(s.left / s.plan.questions * 100) + '%';
            $('compFuelBox').classList.toggle('low', s.left / s.plan.questions <= 0.3);
            if (!s.left) {   // nothing left to play: the button stays visible but disabled
                $('compBtn').textContent = 'All questions played';
                document.querySelector('.comp-btn').classList.add('is-disabled');
                $('quickPlay').setAttribute('aria-disabled', 'true');
            }
        })();
    </script>
    <script>
        // Daily Competition card: countdown to the next challenge, gentle tilt with the pointer, tap ripple
        (function () {
            var card = document.getElementById('quickPlay'), btn = card.querySelector('.comp-btn'), clock = document.getElementById('compCountdown');
            function tick() {
                var now = new Date(), end = new Date(now), sub = window.MQ && QP_DEMO.user && MQ.sub(); end.setHours(24, 0, 0, 0);
                if (sub) end = new Date(sub.periodEnd);
                var s = Math.floor((end - now) / 1000);
                clock.textContent = [s / 3600, s / 60 % 60, s % 60].map(function (n) { return String(Math.floor(n)).padStart(2, '0'); }).join(':');
            }
            tick(); setInterval(tick, 1000);
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            function follow(e) {
                var r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
                card.style.setProperty('--px', x.toFixed(3));
                card.style.setProperty('--py', y.toFixed(3));
                card.classList.add('is-live');
            }
            function rest() {
                card.classList.remove('is-live');
                card.style.removeProperty('--px'); card.style.removeProperty('--py');
            }
            card.addEventListener('pointermove', follow);
            card.addEventListener('pointerdown', follow);
            card.addEventListener('pointerleave', rest);
            card.addEventListener('pointercancel', rest);
            btn.addEventListener('pointerdown', function (e) {
                var r = btn.getBoundingClientRect(), w = document.createElement('i');
                w.className = 'comp-ripple';
                w.style.left = (e.clientX - r.left) + 'px'; w.style.top = (e.clientY - r.top) + 'px';
                btn.appendChild(w);
                setTimeout(function () { w.remove(); }, 600);
            });
        })();
    </script>
