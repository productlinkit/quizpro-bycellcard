    <script>
        // Quick Play: the system picks a random category that has questions
        (function () {
            var D = window.QP_DEMO, card = document.getElementById('quickPlay');
            if (!D || !card) return;
            card.addEventListener('click', function (e) {
                e.preventDefault();
                var pick = D.PLAYABLE[Math.floor(Math.random() * D.PLAYABLE.length)];
                location.href = 'game-play.html?game=' + pick + '&level=1';
            });
        })();
    </script>
