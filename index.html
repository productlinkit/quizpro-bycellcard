<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorQuiz</title>
    <link rel="stylesheet" href="theme/css/bootstrap.min.css">
    <link rel="stylesheet" href="theme/fontello/css/quizy-flash.css">
    <link rel="stylesheet" href="theme/css/style.css">
    <link rel="stylesheet" href="theme/css/app.css">
    <link rel="stylesheet" href="theme/css/guest.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta name="csrf-token" content="CSRF_PLACEHOLDER" />
    <link rel="icon" type="image/svg+xml" href="theme/images/motorquiz-icon.svg">
    <link rel="stylesheet" href="theme/lucky-draw/ld.css">
    <link rel="stylesheet" href="theme/css/motorquiz.css">
</head>
<body>
    <div class="splash" id="splash" aria-hidden="true">
        <span class="splash-glow"></span>
        <img class="splash-bike" src="theme/images/motorbike.svg" alt="">
        <span class="mq-logo lg splash-logo"><svg class="mq-logo-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#1F6BFF"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="44.8 15" transform="rotate(135 16 16)"/><path d="M16 16 L21.5 10.5" stroke="#F6C445" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="2.8" fill="#F6C445"/><path d="M21.5 21.5 L26 26" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg><span>Motor<b>Quiz</b></span></span>
        <span class="splash-bar"><i></i></span>
    </div>
    <script>
        // Splash on every fresh open or refresh; skipped only when coming back from another page of the app
        (function () {
            var nav = performance.getEntriesByType('navigation')[0];
            var s = document.getElementById('splash');
            if (document.referrer.indexOf(location.origin) === 0 && !(nav && nav.type === 'reload')) s.remove();
            else setTimeout(function () { s.classList.add('out'); setTimeout(function () { s.remove(); }, 350); }, 2200);
        })();
    </script>

    <div class="content-wrapper">
        <div class="container box-wrapper">
            <div class="header">
                <div class="row align-items-center">
                    <div class="col-6 text-start">
                        <div class="logo">
                            <a href="index.html" class="text-decoration-none">
                                <span class="mq-logo"><svg class="mq-logo-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#1F6BFF"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="44.8 15" transform="rotate(135 16 16)"/><path d="M16 16 L21.5 10.5" stroke="#F6C445" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="2.8" fill="#F6C445"/><path d="M21.5 21.5 L26 26" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg><span>Motor<b>Quiz</b></span></span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="home-profile">
                <div class="row gx-0">
                    <div class="col-7 text-start">
                        <div class="d-flex align-items-center">
                            <div class="avatar">
                                <img src="https://demo.quizpro.mobi//uploads/user/2/91819a12c87646f315a23b80fbf283ea.jpg" alt="Avatar">
                            </div>
                            <div class="flex-grow-1 ms-2">
                                <div class="home-profile-name">1234567890</div>
                                <div class="home-profile-status" id="homeStatus">Subscriber</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-5 text-end">
                        <div class="h-100 d-flex align-items-center justify-content-end">
                            <div class="home-profile-points" aria-label="Total points">
                                <span class="home-profile-points-badge"><span class="fa fa-star"></span></span>
                                <span id="homePoints">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Weekly grand prize -->
            <a href="lucky-draw.html" class="mq-prize d-block text-decoration-none" id="homePrize">
                <span class="mq-prize-value"><small>Worth</small><span id="prizeValue">$2,500</span></span>
                <span class="mq-prize-tag"><span class="fa fa-trophy"></span> Weekly Grand Prize</span>
                <div class="mq-prize-title">Win a <b>Motorbike</b><br>every week</div>
                <div class="mq-prize-sub">1 winner every week from the Lucky Draw</div>
                <img class="mq-prize-bike" src="theme/images/motorbike.svg" alt="Motorbike grand prize">
                <div class="mq-prize-foot">
                    <span><span class="d-block" style="opacity:.75">My entries this week</span><b id="prizeEntries">–</b></span>
                    <span class="text-end"><span class="d-block" style="opacity:.75">Next draw in</span><span class="mq-count" id="prizeCount"></span></span>
                </div>
            </a>

            <!-- Play: filled in by the script below for guests, members without a plan and subscribers -->
            <div id="playRoot"></div>
        </div>

        <div class="bottom-spacer" style="height: 65px;"></div>
<div class="bottom-nav">
    <div class="bottom-nav-bg row gx-0 box-wrapper mx-auto container-fluid">
        <div class="col active"><div class="nav-box"><a href="index.html" class="nav-box-ico"><svg class="mq-nav-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor"/></svg><span class="nav-label">Play</span></a></div></div>
        <div class="col"><div class="nav-box"><a href="lucky-draw.html" class="nav-box-ico"><svg class="ld-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/></svg><span class="nav-label">Prize</span></a></div></div>
        <div class="col"><div class="nav-box"><a href="profile.html" class="nav-box-ico"><svg class="mq-nav-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg><span class="nav-label">Account</span></a></div></div>
    </div>
</div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>
    <script src="theme/js/demo-backend.js"></script>
    <script src="theme/js/motorquiz.js"></script>
    <script src="theme/js/i18n.js"></script>
    <script src="theme/js/bootstrap.bundle.min.js"></script>
    <script src="theme/js/custom.js"></script>
    <script src="theme/lucky-draw/ld-config.js"></script>
    <script>
    // Play tab: subscription status, remaining questions, points, entries and bonus progress
    (function () {
        var C = MQ.CONFIG, user = QP_DEMO.user, s = user && MQ.sub(), st = MQ.stats(), root = document.getElementById('playRoot');
        function $(id) { return document.getElementById(id); }
        function dateTime(ms) { return QP_I18N.date(new Date(ms), { time: true, noYear: true }); }

        $('prizeValue').textContent = MQ.money(C.grandPrize.value);
        $('homePoints').textContent = st.points.toLocaleString('en-US');
        $('prizeEntries').textContent = user ? st.entries : 'Login to join';
        if (user) $('homeStatus').textContent = s ? (s.plan.trial ? 'Free Trial' : s.plan.name) : 'No active plan';

        // Countdown to the next weekly draw
        function tick() {
            var sec = Math.max(0, Math.floor((new Date(LD_CONFIG.campaign.drawDate) - Date.now()) / 1000));
            $('prizeCount').innerHTML = [[sec / 86400, 'd'], [sec % 86400 / 3600, 'h'], [sec % 3600 / 60, 'm']].map(function (p) {
                return '<div><b>' + String(Math.floor(p[0])).padStart(2, '0') + '</b><span>' + p[1] + '</span></div>';
            }).join('');
        }
        tick(); setInterval(tick, 30000);

        var steps = '<div class="mq-card"><div class="mq-card-head"><h3 class="mq-card-title">How it works</h3></div><div class="mq-steps">' +
            '<div class="mq-step"><span class="mq-step-ico"><span class="fa fa-mobile"></span><i>1</i></span><b>Choose a plan</b>Daily or Weekly</div>' +
            '<div class="mq-step"><span class="mq-step-ico"><span class="fa fa-question"></span><i>2</i></span><b>Play the quiz</b>1 point per correct answer</div>' +
            '<div class="mq-step"><span class="mq-step-ico"><span class="fa fa-ticket"></span><i>3</i></span><b>Collect entries</b>+1 entry every ' + C.bonus.everyCorrect + ' correct</div>' +
            '</div></div>';

        // Guests: start the journey at login
        if (!user) {
            root.innerHTML = '<div class="mq-card text-center">' +
                '<h3 class="mq-card-title mb-1">Play. Score. Ride home a motorbike.</h3>' +
                '<p class="mq-empty mt-0 mb-0">Answer quiz questions to earn points and Lucky Draw entries.</p>' +
                '<a href="' + QP_DEMO.loginUrl('index.html') + '" class="btn btn-lg button-gold mq-play-btn"><span class="fa fa-gift"></span> Start Free Trial</a>' +
                '<a href="' + QP_DEMO.loginUrl('index.html') + '" class="d-block mt-3 fw-bold text-decoration-none" style="color:var(--mq-blue)">Already subscribed? Login</a>' +
                '</div>' + steps;
            return;
        }

        // Logged in without an active plan: choose a subscription
        if (!s) {
            var trial = MQ.trialAvailable();
            root.innerHTML = '<div class="mq-card">' +
                '<div class="mq-sub"><span class="mq-sub-ico off"><span class="fa fa-lock"></span></span>' +
                    '<div class="mq-sub-text"><b>Choose a plan to start playing</b><small>Daily ' + MQ.money(C.plans[0].price) + '/day · Weekly ' + MQ.money(C.plans[1].price) + '/week</small></div>' +
                    '<span class="mq-pill off">No plan</span></div>' +
                '<a href="subscribe.html" class="btn btn-lg ' + (trial ? 'button-gold' : 'button-primary') + ' mq-play-btn">' +
                    (trial ? '<span class="fa fa-gift"></span> Start Free Trial' : '<span class="fa fa-bolt"></span> Subscribe Now') + '</a>' +
                (trial ? '<a href="subscribe.html" class="d-block text-center mt-3 fw-bold text-decoration-none" style="color:var(--mq-blue)">See Daily &amp; Weekly plans</a>' : '') +
                '</div>' + steps;
            return;
        }

        // Subscriber or trial user
        var p = s.plan, need = C.bonus.everyCorrect, prog = st.progress;
        var status = p.trial ? '<span class="mq-pill trial">Free Trial</span>' : s.cancelled ? '<span class="mq-pill ending">Ends soon</span>' : '<span class="mq-pill on">Active</span>';
        var allowance = p.trial ? (C.trial.confirmed ? '' : '<span class="mq-tbc">trial allowance TBC</span>') : '';
        var play = s.left > 0
            ? '<a href="game-play.html" class="btn btn-lg button-primary mq-play-btn" id="playNow"><span class="fa fa-play"></span> Play Now</a>' +
              '<div class="mq-empty">' + Math.min(C.roundSize, s.left) + ' questions per round · 20 sec each · True or False</div>'
            : '<span class="btn btn-lg button-grey mq-play-btn disabled"><span class="fa fa-check"></span> All questions played</span>' +
              '<div class="mq-empty">' + (s.cancelled || p.trial ? 'Your plan ends ' : 'New questions on ') + dateTime(s.periodEnd) + '</div>' +
              (p.id !== 'weekly' ? '<a href="subscribe.html?change=1" class="d-block text-center mt-2 fw-bold text-decoration-none" style="color:var(--mq-blue)">Get ' + C.plans[1].questions + ' questions with the Weekly Plan</a>' : '');
        root.innerHTML = '<div class="mq-card">' +
            '<div class="mq-sub"><span class="mq-sub-ico' + (p.trial ? ' trial' : '') + '"><span class="fa ' + (p.trial ? 'fa-gift' : 'fa-check-circle') + '"></span></span>' +
                '<div class="mq-sub-text"><b>' + (p.trial ? 'Free 1-Day Trial' : p.name) + '</b><small>' +
                    (p.trial ? 'Ends ' + dateTime(s.periodEnd) : MQ.money(p.price) + '/' + p.per + ' · ' + (s.cancelled ? 'ends ' : 'renews ') + dateTime(s.periodEnd)) + '</small></div>' +
                status + '</div>' +
            '<div class="mq-stats">' +
                '<div class="mq-stat"><span class="mq-stat-ico q"><span class="fa fa-question"></span></span><b>' + s.left + '<small style="display:inline;font-size:.75rem">/' + p.questions + '</small></b><small>Questions left</small></div>' +
                '<div class="mq-stat"><span class="mq-stat-ico p"><span class="fa fa-star"></span></span><b>' + st.points.toLocaleString('en-US') + '</b><small>Total points</small></div>' +
                '<div class="mq-stat"><span class="mq-stat-ico e"><span class="fa fa-ticket"></span></span><b>' + st.entries + '</b><small>Draw entries</small></div>' +
            '</div>' + (allowance ? '<div class="text-center mt-2">' + allowance + '</div>' : '') +
            '<div class="mq-bonus">' +
                '<div class="mq-bonus-top"><span><span class="fa fa-ticket"></span> Next bonus entry</span><b>' + prog + '/' + need + ' correct</b></div>' +
                '<div class="mq-bonus-dots" style="grid-template-columns:repeat(' + need + ',1fr)">' + Array.apply(null, Array(need)).map(function (x, i) { return '<i class="' + (i < prog ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
                '<div class="mq-bonus-note">' + (need - prog) + ' more correct answer' + (need - prog === 1 ? '' : 's') + ' = +' + C.bonus.entries + ' Lucky Draw entry</div>' +
            '</div>' + play + '</div>' +
            '<div class="mq-card"><div class="mq-card-head"><h3 class="mq-card-title">This week\'s entries</h3><a class="mq-card-link" href="lucky-draw.html">See Prize <span class="fa fa-angle-right"></span></a></div>' +
                '<div class="d-flex justify-content-between small"><span>From your plan</span><b>' + st.planEntries + '</b></div>' +
                '<div class="d-flex justify-content-between small mt-1"><span>Bonus (every ' + need + ' correct)</span><b>' + st.bonusEntries + '</b></div>' +
            '</div>';
    })();
    </script>
</body>
</html>
