<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizy Flash</title>
    <link rel="stylesheet" href="theme/css/bootstrap.min.css">
    <link rel="stylesheet" href="theme/fontello/css/quizy-flash.css">
    <link rel="stylesheet" href="theme/css/style.css">
    <meta name="csrf-token" content="CSRF_PLACEHOLDER" />
    <link rel="shortcut icon" type="image/x-icon" href="https://demo.quizpro.mobi//theme/images/favicon-quizpro.ico">
</head>
<body>
    <div class="content-wrapper">

        
    <div class="content-wrapper">

        <div class="page-header">
            <div class="box-wrapper mx-auto text-center position-relative">
                <a href="profile.html" class="page-header-back"><span class="qf-icon-back"></span></a>
                Edit Profile
            </div>
        </div>

        <div class="text-center mb-3">
            <div class="avatar">
                                                                <img src="https://demo.quizpro.mobi//uploads/user/2/91819a12c87646f315a23b80fbf283ea.jpg" alt="Avatar">
            </div>
        </div>

        <div class="container box-wrapper">


            <div class="card-simple">
                <form action="https://demo.quizpro.mobi/profile/save" class="form" method="post" enctype="multipart/form-data">
                    <input type="hidden" name="_token" value="CSRF_PLACEHOLDER"> <input type="hidden" name="user_id" value="2">
                    <div class="mb-3">
                        <label class="fw-bold form-label" for="avatar">Avatar</label>
                        <input type="file" class="form-control-file" id="avatar" name="avatar">
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold form-label" for="username">Name</label>
                        <input type="text" class="form-control shadow-sm" placeholder="Name" name="username" id="username" value="xx">
                    </div>

                    <button type="submit" class="btn btn-lg button-primary w-100">Save</button>
                </form>
            </div>
        </div>

    </div>
    

    </div>

    <!-- Login Model Start -->
    <div class="modal fade modal-standard" tabindex="-1" role="dialog" id="modalplay">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header" style="background: #3EA9F5;">
                    <img src="https://demo.quizpro.mobi//theme/images/logo_quizypro.png" width="80" alt="Logo">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">Please login first to continue</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary shadow-sm" data-bs-dismiss="modal" aria-label="Close">Close</button>
                    <a href="login.html" class="btn button-green shadow-sm">Login</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Login Model End -->

    <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>
    <script src="theme/js/demo-backend.js"></script>
    <script src="theme/js/bootstrap.bundle.min.js"></script>

    <script src="theme/js/custom.js"></script>

    
</body>
</html>
